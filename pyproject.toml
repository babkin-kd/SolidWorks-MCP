[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-mcp"
version = "2.0.0.dev3"
description = "MCP server that drives a local SolidWorks instance over COM for parametric part modelling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Henk Jan Baard" }]
keywords = ["solidworks", "mcp", "cad", "com", "parametric", "3d-printing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Windows-only; elsewhere the server starts and lists its tools, calls fail loud.
    "pywin32>=306; sys_platform == 'win32'",
    # mcp 2.x renamed FastMCP (server.py fails on import); 1.26+ is verified.
    "mcp>=1.26,<2",
]

[project.urls]
Homepage = "https://github.com/babkin-kd/SolidWorks-MCP"
Repository = "https://github.com/babkin-kd/SolidWorks-MCP"
Changelog = "https://github.com/babkin-kd/SolidWorks-MCP/blob/main/CHANGELOG.md"
Issues = "https://github.com/babkin-kd/SolidWorks-MCP/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
solidworks-mcp-v2 = "solidworks_mcp.server_v2:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solidworks_mcp = ["guide.md", "guide_v2.md", "build_info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "solidworks: integration test that needs a running SolidWorks instance",
]
