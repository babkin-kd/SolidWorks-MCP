# Unit/build validation only; no native CAD/PDM/Simulation acceptance.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Unit tests (runner has no SolidWorks)
        run: uv run --extra dev pytest -m "not solidworks"
      - name: Build fork wheel and source distribution
        run: |
          uv run scripts/write_build_info.py
          uv build
